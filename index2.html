<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ever Blue Gardenia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f0f0f; color: #f1f1f1; font-family: sans-serif; padding: 20px; }
        header { max-width: 1200px; margin: 0 auto 30px auto; padding-bottom: 15px; border-bottom: 1px solid #3f3f3f; }
        header h1 { font-size: 24px; color: #fff; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
        .video-card { background-color: #171717; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .video-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-info { padding: 15px; }
        .video-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .video-desc { font-size: 13px; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <h1>Ever Blue Gardenia</h1>
        <h3>Lysie Singclair's Video Archives</h3>
    </header>
    <hr>
    <div class="video-grid" id="video-grid">
        <!-- Video cards fetched from video.csv is automatically created here -->
    </div>

    <script>
        async function loadCsvVideos() {
            try {
                // Read the videos.csv file in the same folder (add a cache-avoiding formula)
                const response = await fetch('videos.csv?v=' + Date.now());
                const data = await response.text();
                
                const lines = data.split('\n');
                const grid = document.getElementById('video-grid');
                
                // Analyze one line at a time, excluding the first line (header)
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    // Separate data with commas
                    const [title, videoUrl, posterUrl, desc] = line.split(',');
                    
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="video-wrapper">
                            <video controls preload="metadata" poster="${posterUrl || ''}">
                                <source src="${videoUrl}" type="video/mp4">
                            </video>
                        </div>
                        <div class="video-info">
                            <h3 class="video-title">${title}</h3>
                            <p class="video-desc">${desc || ''}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            } catch (error) {
                console.error("Data Load Failure:", error);
            }
        }

        // Execute
        loadCsvVideos();
    </script>
</body>
</html>
