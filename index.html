<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 청정 비디오 채널</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f0f0f; color: #f1f1f1; font-family: sans-serif; padding: 20px; }
        header { max-width: 1200px; margin: 0 auto 30px auto; padding-bottom: 15px; border-bottom: 1px solid #3f3f3f; }
        header h1 { font-size: 24px; color: #fff; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
        .video-card { background-color: #171717; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .video-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-info { padding: 15px; }
        .video-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .video-desc { font-size: 13px; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <h1>독립 비디오 스튜디오</h1>
    </header>

    <div class="video-grid">

        <!-- 🎥 [새 영상 올릴 때 이 구역을 통째로 복사해서 바로 밑에 붙여넣으세요] -->
        <div class="video-card">
            <div class="video-wrapper">
                <!-- 아까 찾으신 진짜 mp4 직링크 주소를 src에 넣고, 표지 이미지가 있다면 poster에 넣습니다 -->
                <video controls preload="metadata" poster="https://archive.org">
                    <source src="https://ia601004.us.archive.org/29/items/time-lapse-471/time-lapse-471.mp4" type="video/mp4">
                </video>
            </div>
            <div class="video-info">
                <h3 class="video-title">Pure Lights on a Bright Day 🌬️🫧</h3>
                <p class="video-desc">---</p>
            </div>
        </div>
        <!-- 🎥 영상 카드 끝 -->
    </div>
</body>
</html>
